name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shopt -s nullglob
          files=(provision.sh lib/*.sh scripts/*.sh)
          [ -f tests/smoke.sh ] && files+=(tests/smoke.sh)
          shellcheck -x "${files[@]}"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Tests unitaires
        run: tests/run.sh

  smoke:
    name: smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          # debian:11 non supportée : Bullseye est en fin de vie (LTS terminé le 31/08/2026),
          # son dépôt de sécurité renvoie des 404 sur deb.debian.org, ce qui casse
          # l'installation de ca-certificates dans le conteneur, avant même le script.
          - debian:12
          - debian:13
          - ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: scripts/bundle.sh
      - name: Test de fumée
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} bash tests/smoke.sh
