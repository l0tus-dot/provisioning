name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shopt -s nullglob
          shellcheck -x provision.sh lib/*.sh scripts/*.sh tests/smoke.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sous-modules
        run: git submodule update --init
      - name: Tests unitaires
        run: tests/run.sh
