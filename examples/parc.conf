# Configuration d'exemple : serveur du parc (aucune question, résultat identique partout).
# Utilisation : sudo ./provision.sh --config parc.conf [--dry-run]

# Mise à jour complète du système (apt update + full-upgrade + autoremove) : yes | no
UPDATE_SYSTEM="yes"

# Outils à installer : gestionnaire:nom[@version] séparés par des espaces
# (gestionnaires : apt, snap, flatpak, pip, npm, cargo)
TOOLS="apt:git apt:curl apt:htop apt:fail2ban"

# Debian uniquement : composants à ajouter (contrib non-free non-free-firmware)
DEBIAN_COMPONENTS=""

# Debian uniquement : activer les backports : yes | no
DEBIAN_BACKPORTS="no"

# Debian uniquement : installer snapd : yes | no
INSTALL_SNAPD="no"

# Installer flatpak et le dépôt Flathub (Ubuntu et Debian) : yes | no
INSTALL_FLATPAK="no"

# Pare-feu UFW : yes = configurer et activer, no = ne rien toucher
UFW_ENABLE="yes"

# Port SSH à autoriser : auto (détecté dans la configuration sshd) | un numéro | none
# En session SSH, le port SSH effectif reste toujours autorisé.
UFW_SSH_PORT="auto"

# Règles UFW supplémentaires (ex. 80/tcp 443/tcp 5432/tcp 60000:61000/udp)
UFW_ALLOW=""

# Services à masquer (stop + mask)
SERVICES_MASK="cups cups-browsed avahi-daemon bluetooth ModemManager"

# Services à désactiver au démarrage (disable --now)
SERVICES_DISABLE=""

# Redémarrage en fin d'exécution : yes | no | if-needed (si /var/run/reboot-required existe)
REBOOT="if-needed"
