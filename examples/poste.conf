# Configuration d'exemple : poste de travail (outils de développement).
# Utilisation : sudo ./provision.sh --config poste.conf [--dry-run]

# Mise à jour complète du système (apt update + full-upgrade + autoremove) : yes | no
UPDATE_SYSTEM="yes"

# Outils à installer : gestionnaire:nom[@version] séparés par des espaces
# (gestionnaires : apt, snap, flatpak, pip, npm, cargo). Les outils sont installés dans l'ordre
# indiqué : apt:npm et apt:cargo doivent précéder npm: et cargo:.
TOOLS="apt:git apt:curl apt:vim apt:build-essential apt:python3-venv apt:npm apt:cargo snap:code flatpak:org.gimp.GIMP pip:httpie npm:typescript cargo:ripgrep"

# Debian uniquement : composants à ajouter (contrib non-free non-free-firmware)
DEBIAN_COMPONENTS="contrib non-free non-free-firmware"

# Debian uniquement : activer les backports : yes | no
DEBIAN_BACKPORTS="no"

# Debian uniquement : installer snapd (nécessaire pour les outils snap:) : yes | no
INSTALL_SNAPD="yes"

# Installer flatpak et le dépôt Flathub (Ubuntu et Debian) : yes | no
INSTALL_FLATPAK="yes"

# Pare-feu UFW : yes = configurer et activer, no = ne rien toucher
UFW_ENABLE="yes"

# Port SSH à autoriser : auto (détecté dans la configuration sshd) | un numéro | none
UFW_SSH_PORT="auto"

# Règles UFW supplémentaires (ex. 80/tcp 443/tcp)
UFW_ALLOW=""

# Services à masquer (stop + mask) : aucun sur un poste de travail
SERVICES_MASK=""

# Services à désactiver au démarrage (disable --now)
SERVICES_DISABLE=""

# Redémarrage en fin d'exécution : yes | no | if-needed
REBOOT="no"
